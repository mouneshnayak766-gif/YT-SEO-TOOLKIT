spring.application.name=yt-seo-toolkit
server.port=8080

# ==== YouTube Data API v3 ====
# Get a key from https://console.cloud.google.com/apis/credentials
# NEVER commit a real key. Use an env var in production:
#   export YOUTUBE_API_KEY=xxxx
youtube.api.key=${YOUTUBE_API_KEY:PUT_YOUR_API_KEY_HERE}
youtube.api.base-url=https://www.googleapis.com/youtube/v3

# ==== CORS (React dev server) ====
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==== Logging ====
logging.level.com.example.ytseotoolkit=INFO
logging.level.org.springframework.web=INFO
